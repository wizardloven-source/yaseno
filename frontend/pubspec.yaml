# frontend/pubspec.yaml
name: ya_seen_erp_flutter
description: نظام محاسبي متكامل لإدارة حسابات الشركات - YAseen ERP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  # bloc: ^8.1.3  # للمستقبل إذا لزم الأمر

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  retry: ^3.1.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  intl: ^0.20.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Charts & Dashboard
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: 34.2.4

  # Tables
  data_table_2: ^2.5.8

  # Printing & Export
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.3
  file_picker: ^8.0.0

  # Notifications
  flutter_local_notifications: ^16.3.2
  # firebase_messaging: ^14.7.9  # للمستقبل

  # Utilities
  uuid: ^4.2.2
  collection: ^1.18.0
  decimal: ^2.3.3
  path_provider: ^2.1.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  go_router: ^17.5.0
  logger: ^2.7.0

  # Barcode (للمخزون)
  # barcode_scan2: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600